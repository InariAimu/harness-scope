# Bootstrap HTTP site before issuing the certificate with Certbot webroot.
server {
    listen 80;
    listen [::]:80;
    server_name hs.amu.moe;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/harness-scope-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
