limit_req_zone $binary_remote_addr zone=harness_scope:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name hs.amu.moe;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/harness-scope-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hs.amu.moe;
    ssl_certificate /etc/letsencrypt/live/hs.amu.moe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hs.amu.moe/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:HARNESS_SCOPE_TLS:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    client_max_body_size 5m;
    access_log /var/log/nginx/hs.amu.moe.access.log;
    error_log /var/log/nginx/hs.amu.moe.error.log;

    location = /health {
        include /etc/nginx/snippets/harness-scope-proxy.conf;
    }
    location = /v1/push {
        include /etc/nginx/snippets/harness-scope-proxy.conf;
    }
    location = /v1/changes {
        include /etc/nginx/snippets/harness-scope-proxy.conf;
    }
    location = /v1/subscriptions/push {
        include /etc/nginx/snippets/harness-scope-proxy.conf;
    }
    location = /v1/subscriptions/changes {
        include /etc/nginx/snippets/harness-scope-proxy.conf;
    }
    location / {
        return 404;
    }
}
